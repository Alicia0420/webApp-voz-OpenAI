<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Control por Voz</title>
    <link rel="icon" href="img/favicon.png" type="image/x-icon">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-dark text-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎙️ Control por Voz</span>
            <span id="status" class="badge bg-success">Escuchando...</span>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="container text-center mt-5">
        <h2 id="mode">Modo activo</h2>

        <!-- TEXTO ESCUCHADO -->
        <div class="card bg-secondary text-light mt-4 shadow">
            <div class="card-body">
                <h5>🎧 Texto escuchado</h5>
                <p id="heard" class="fs-5 fst-italic">---</p>
            </div>
        </div>

        <!-- ORDEN INTERPRETADA -->
        <div class="card bg-info text-dark mt-4 shadow">
            <div class="card-body">
                <h5>🧠 Orden interpretada</h5>
                <p id="result" class="fs-4 fw-bold">---</p>
            </div>
        </div>
        <!-- HISTORIAL -->
        <div class="card bg-dark text-light mt-4 shadow">
            <div class="card-body">
                <h5>📝 Historial de mensajes</h5>
                <ul id="history" class="list-group list-group-flush text-start">
                    <!-- Aquí se irán agregando los mensajes -->
                </ul>
            </div>
        </div>

        <!-- MENSAJE DE AYUDA -->
        <div id="hint" class="mt-4 text-muted fst-italic"></div>
    </main>

    <script src="app.js"></script>
</body>

</html>
